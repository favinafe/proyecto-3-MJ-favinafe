<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital de Clínicas - Recuperación</title>
<link rel="stylesheet" href="../../elementosComunes/css/style.css">
</head>
<body>
  <main class="card">
    <div class="head">
      <h1>Recuperación</h1>
      <img class="logo" src="../../elementosComunes/imagenes/logo.png" alt="Hospital de Clínicas Dr. Manuel Quintela">
    </div>
    <form id="recuperacion" novalidate>
      <label for="email">Email:</label>
      <input id="email" type="email" autocomplete="email">
      <label for="problema">Explica tu problema:</label>
      <textarea id="problema"></textarea>
      <p class="msg" id="msg"></p>
      <button class="btn" type="submit">Confirmar</button>
    </form>
  </main>
  <a class="btn esquina" href="../../index.html">Atrás</a>
  <script src="../../elementosComunes/baseDeDatos/data.js"></script>
  <script src="../../elementosComunes/baseDeDatos/db.js"></script>
  <script src="javaScript/script.js"></script>
</body>
</html>
