<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Hospital</title>
    <link rel="stylesheet" href="login/vista/css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>


    <div class="container-fluid h-100">

        <div class="row h-100">

            <div class="col-lg-5 d-flex align-items-center">

                <div class="login-card">

                    <div class="d-flex justify-content-between align-items-center mb-5">

                        <h1 class="titulo">
                            Bienvenido
                        </h1>

                        <img src="elementosComunes/imagenes/logo.png" class="logo" alt="Logo">

                    </div>

                    <div class="mb-5">

                        <label class="etiquetaSup">
                            Usuario:
                        </label>

                        <input
                            class="form-control campo"
                            type="text"
                            name="usuario"
                            placeholder="Usuario"
                        >

                        <label class="etiquetaError" hidden name="eUsr">
                            Usuario incorrecto
                        </label>

                    </div>

                    <div class="mb-5">

                        <label class="etiquetaSup">
                            Contraseña:
                        </label>

                        <input
                            class="form-control campo"
                            type="password"
                            name="contrasena"
                            placeholder="Contraseña"
                            autocomplete="username"
                        >

                        <label class="etiquetaError" hidden name="ePaswd">
                            Contraseña incorrecta
                        </label>

                    </div>
                        <button class="boton" type="submit">
                            confirmar
                        </button>
                    
                       <button class="boton">
                           No puedo entrar
                        </button>
                </div>

            </div>

        </div>

    </div>
</body>
</html>
