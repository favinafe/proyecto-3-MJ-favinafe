<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Hospital</title>
    <link rel="stylesheet" href="login/vista/css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="overlay">

    <div class="container-fluid h-100">

        <div class="row h-100">

            <!-- Login -->
            <div class="col-lg-5 d-flex align-items-center">

                <div class="login-card">

                    <div class="d-flex justify-content-between align-items-center mb-5">

                        <h1 class="titulo">
                            Bienvenido
                        </h1>

                        <img src="elementosComunes/imagenes/logo.png" class="logo" alt="Logo">

                    </div>

                    <div class="mb-5">

                        <label class="form-label etiqueta">
                            Usuario:
                        </label>

                        <input
                            type="text"
                            class="form-control campo">

                    </div>

                    <div class="mb-5">

                        <label class="form-label etiqueta">
                            Contraseña:
                        </label>

                        <input
                            type="password"
                            class="form-control campo">

                    </div>

                    <button class="btn boton-confirmar">
                        confirmar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <button class="btn boton-ayuda">
        No puedo entrar
    </button>

</div>

</body>
</html>
