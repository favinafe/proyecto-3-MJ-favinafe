<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital de Clínicas - Ingreso</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="head">
      <h1>Bienvenido</h1>
      <img class="logo" src="img/logo.png" alt="Hospital de Clínicas Dr. Manuel Quintela">
    </div>
    <form id="login" novalidate>
      <label for="usuario">Usuario:</label>
      <input id="usuario" type="text" autocomplete="username">
      <label for="clave">Contraseña:</label>
      <input id="clave" type="password" autocomplete="current-password">
      <p class="msg" id="msg"></p>
      <button class="btn" type="submit">Confirmar</button>
    </form>
  </main>
  <a class="btn esquina" href="recuperacion.html">No puedo entrar</a>
  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="script.js"></script>
<script src="idioma.js"></script>
</body>
</html>
