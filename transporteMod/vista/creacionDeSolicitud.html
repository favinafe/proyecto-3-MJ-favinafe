<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creación de solicitud</title>
    <link rel="stylesheet" href="css/creacionDeSolicitud.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid p-0">

    <!-- Encabezado -->

    <header class="bg-white shadow-sm py-3 px-4">

        <div class="row align-items-center">

            <div class="col-12 col-lg-2 text-center text-lg-start">

                <img src="img.jpg" class="logo img-fluid" alt="Logo">

            </div>

            <div class="col-12 col-lg-8 text-center text-lg-start">

                <h1 class="titulo">
                    Creación de solicitud
                </h1>

            </div>

            <div class="col-12 col-lg-2 text-center text-lg-end mt-3 mt-lg-0">

                <button class="btn boton">
                    Atrás
                </button>

            </div>

        </div>

    </header>

    <!-- Contenido -->

    <main class="container-fluid py-4">

        <div class="row g-4">

            <!-- Columna izquierda -->

            <div class="col-12 col-lg-3">

                <div class="mb-3">

                    <label class="etiqueta">Chofer:</label>
                    <input type="text" class="form-control campo">

                </div>

                <div class="mb-3">

                    <label class="etiqueta">Enfermero:</label>
                    <input type="text" class="form-control campo">

                </div>

                <div class="mb-3">

                    <label class="etiqueta">Proveedor:</label>
                    <input type="text" class="form-control campo">

                </div>

                <div class="mb-3">

                    <label class="etiqueta">Destino:</label>

                    <select class="form-select campo">

                        <option>Seleccione...</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="etiqueta">¿Qué se transporta?</label>

                    <select class="form-select campo">

                        <option>Seleccione...</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="texto-pequeno">

                        CI del paciente o elemento a transportar:

                    </label>

                    <input type="text" class="form-control campo">

                </div>

                <div>

                    <label class="etiqueta">Canal:</label>

                    <select class="form-select campo">

                        <option>Seleccione...</option>

                    </select>

                </div>

            </div>

            <!-- Columna central -->

            <div class="col-12 col-lg-3">

                <div class="mb-3">

                    <label class="etiqueta">Motivo:</label>

                    <select class="form-select campo">

                        <option>Seleccione...</option>

                    </select>

                </div>

                <div class="mb-5">

                    <label class="etiqueta">Tipo de vehículo:</label>

                    <select class="form-select campo">

                        <option>Seleccione...</option>

                    </select>

                </div>

                <button class="btn boton w-100 mt-lg-5">

                    Crear

                </button>

            </div>

            <!-- Columna derecha -->

            <div class="col-12 col-lg-6">

                <label class="etiqueta">

                    Descripción:

                </label>

                <textarea class="form-control descripcion"></textarea>

            </div>

        </div>

    </main>

</div>

</body>

</html>
