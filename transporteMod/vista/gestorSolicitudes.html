<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de solicitudes</title>
    <link rel="stylesheet" href="css/gestorSolicitudes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid p-0">

    <!-- Encabezado -->

    <header class="bg-white shadow-sm py-3 px-4">

        <div class="row align-items-center">

            <div class="col-12 col-lg-2 text-center text-lg-start">

                <img src="img.jpg" class="logo img-fluid" alt="Logo">

            </div>

            <div class="col-12 col-lg-8 text-center my-3 my-lg-0">

                <h1 class="titulo">
                    Gestor de solicitudes
                </h1>

            </div>

            <div class="col-12 col-lg-2 text-center text-lg-end">

                <button class="btn boton">
                    Atrás
                </button>

            </div>

        </div>

    </header>

    <!-- Contenido -->

    <main class="container-fluid py-4">

        <div class="row">

            <!-- Categoría -->

            <div class="col-12 col-lg-4">

                <label class="etiqueta">
                    Categoría:
                </label>

                <select class="form-select selector">

                    <option>Nefrología</option>
                    <option>Cardiología</option>
                    <option>Pediatría</option>

                </select>

            </div>

            <!-- Botones -->

            <div class="col-12 col-lg-8">

                <div class="row g-3">

                    <div class="col-12 col-md-6">

                        <button class="btn boton w-100">
                            Crear solicitud
                        </button>

                    </div>

                    <div class="col-12 col-md-6">

                        <button class="btn boton w-100">
                            Editar
                        </button>

                    </div>

                    <div class="col-md-6"></div>

                    <div class="col-12 col-md-6">

                        <button class="btn boton w-100">
                            Borrar
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Tabla -->

        <div class="table-responsive mt-5">

            <table class="table tabla">

                <thead>

                    <tr>

                        <th>Paciente/Elemento</th>
                        <th>Canal</th>
                        <th>Origen</th>
                        <th>Inicio de solicitud</th>
                        <th>Estado</th>
                        <th>Usuario</th>
                        <th>Ruta</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
