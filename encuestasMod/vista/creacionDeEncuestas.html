<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear Encuesta</title>
    <link rel="stylesheet" href="css/creacionDeEncuestas.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid p-0">

    <!-- Encabezado -->

    <header class="bg-white shadow-sm py-3 px-4">

        <div class="row align-items-center">

            <div class="col-12 col-lg-2 text-center text-lg-start">
                <img src="img.jpg" class="logo img-fluid">
            </div>

            <div class="col-12 col-lg-8 text-center my-3 my-lg-0">
                <h1 class="titulo">
                    Crear encuesta
                </h1>
            </div>

            <div class="col-12 col-lg-2 text-center text-lg-end">
                <button class="btn boton">
                    Atrás
                </button>
            </div>

        </div>

    </header>


    <!-- Contenido -->

    <main class="container py-5">

        <div class="row">

            <!-- Preguntas -->

            <div class="col-12 col-lg-6">

                <div class="pregunta">

                    <div class="d-flex align-items-center mb-4">

                        <span class="numero me-3">1-</span>

                        <input
                            type="text"
                            class="form-control campo"
                            placeholder="Pregunta">

                    </div>


                    <div class="respuesta">

                        <input class="form-check-input radio" type="radio">

                        <input
                            type="text"
                            class="form-control campo"
                            placeholder="Respuesta">

                    </div>

                    <div class="respuesta">

                        <input class="form-check-input radio" type="radio">

                        <input
                            type="text"
                            class="form-control campo"
                            placeholder="Respuesta">

                    </div>

                    <div class="respuesta">

                        <input class="form-check-input radio" type="radio">

                        <input
                            type="text"
                            class="form-control campo"
                            placeholder="Respuesta">

                    </div>

                    <div class="respuesta">

                        <input class="form-check-input radio" type="radio">

                        <input
                            type="text"
                            class="form-control campo"
                            placeholder="Respuesta">

                    </div>

                </div>

            </div>


            <!-- Botones -->

            <div class="col-12 col-lg-6 d-flex flex-column justify-content-between align-items-center align-items-lg-end mt-5 mt-lg-0">

                <button class="btn boton mt-lg-5">
                    Crear pregunta
                </button>

                <button class="btn boton mt-5">
                    Crear
                </button>

            </div>

        </div>

    </main>

</div>

</body>

</html>
