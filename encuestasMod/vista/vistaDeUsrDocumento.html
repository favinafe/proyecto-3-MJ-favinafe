<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
    <link rel="stylesheet" href="vistaDeUsrDocumento.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid p-0">

    <!-- Encabezado -->

    <header class="bg-white shadow-sm py-3 px-4">

        <div class="row align-items-center">

            <div class="col-12 col-lg-2 text-center text-lg-start">

                <img src="img.jpg" class="logo img-fluid" alt="Logo">

            </div>

            <div class="col-12 col-lg-8 text-center text-lg-start">

                <h1 class="titulo-documento">
                    "NombreDeDocumento"
                </h1>

                <h3 class="categoria">
                    "Categoría"
                </h3>

            </div>

            <div class="col-12 col-lg-2 text-center text-lg-end mt-3 mt-lg-0">

                <button class="btn boton" onclick="window.location.href='gestorDocumentosYSolgestorDocumentosYEncuestas'>
                    Atrás
                </button>

            </div>

        </div>

    </header>

    <!-- Contenido -->

    <main class="container-fluid py-4">

        <div class="row g-4">

            <!-- Documento -->

            <div class="col-12 col-lg-6 text-center">

                <div class="documento">

                    <span>"Documento"</span>

                </div>

            </div>

            <!-- Información -->

            <div class="col-12 col-lg-6 d-flex flex-column">

                <h2 class="descripcion-titulo">
                    Descripción:
                </h2>

                <p class="descripcion">
                    "Descripción"
                </p>

                <div class="mt-auto">

                    <div class="qr">

                        QR

                    </div>

                    <p class="fecha text-end mt-3">
                        01/01/2001
                    </p>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
