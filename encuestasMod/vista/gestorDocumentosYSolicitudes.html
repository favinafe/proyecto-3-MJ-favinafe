<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gestorDocumentosYSolgestorDocumentosYSolicitudes.css">
    <title>Gestor de documentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid p-0">

    <!-- Encabezado -->
    <header class="bg-white px-4 py-3 border-bottom">

        <div class="row align-items-center">

            <div class="col-md-2">
                <img src="img.jpg" class="logo img-fluid">
            </div>

            <div class="col-md-8 text-center">
                <h1 class="titulo">
                    Gestor de documentos y encuestas
                </h1>
            </div>

            <div class="col-md-2 text-end">

                <button class="btn boton">
                    Atras
                </button>

            </div>

        </div>

    </header>


    <!-- Contenido -->

    <main class="contenido p-4">

        <div class="row">

            <!-- Categoria -->

            <div class="col-md-5">

                <label class="etiqueta">
                    Categoria:
                </label>

                <select class="form-select selector">

                    <option>Nefrología</option>
                    <option>Cardiología</option>
                    <option>Pediatría</option>

                </select>

            </div>


            <!-- Botones -->

            <div class="col-md-7">

                <div class="row g-4">

                    <div class="col-6">
                        <button class="btn boton w-100">
                            Crear documento
                        </button>
                    </div>

                    <div class="col-6">
                        <button class="btn boton w-100">
                            Editar
                        </button>
                    </div>

                    <div class="col-6">
                        <button class="btn boton w-100">
                            Crear encuesta
                        </button>
                    </div>

                    <div class="col-6">
                        <button class="btn boton w-100">
                            Borrar
                        </button>
                    </div>

                </div>

            </div>

        </div>


        <!-- Tabla -->

        <div class="table-responsive mt-5">

            <table class="table tabla">

                <thead>

                    <tr>

                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Fecha</th>
                        <th>Usuario que lo ingresó</th>

                    </tr>

                </thead>

                <tbody>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                    <tr>

                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>

</html>
